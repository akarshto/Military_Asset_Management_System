spring.application.name=mams-backend

# Render injects PORT; falls back to 8080 locally
server.port=${PORT:8080}

# PostgreSQL (override with env vars in production)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mams_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:Postgres@123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# JWT (set JWT_SECRET in production, 32+ chars)
jwt.secret=${JWT_SECRET:MySuperSecretKeyForMAMSApplicationThatIsAtLeast32CharactersLong12345}
jwt.expiration=86400000

# CORS: comma-separated list of allowed frontend origins
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
