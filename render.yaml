databases:
  - name: mams-db
    plan: free
    region: singapore
    postgresMajorVersion: 18

services:
  - type: web
    name: mams-backend
    runtime: java
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/backend-0.0.1-SNAPSHOT.jar
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mams-db
          property: connectionString
