# Render Blueprint: New > Blueprint > connect your repo
databases:
  - name: mams-db
    plan: free
    databaseName: mams_db
    user: mams

services:
  - type: web
    name: mams-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DB_HOST
        fromDatabase: { name: mams-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: mams-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: mams-db, property: database }
      - key: DB_USER
        fromDatabase: { name: mams-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: mams-db, property: password }
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGIN
        sync: false   # set to your Vercel/Netlify URL after frontend deploy
